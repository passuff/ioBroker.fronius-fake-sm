# Official ioBroker test + release workflow (Trusted Publishing ready).
# Deploy runs only on version tags; first npm publish is still manual once.

name: Test and Release

on:
  push:
    branches:
      - '*'
    tags:
      - 'v?[0-9]+.[0-9]+.[0-9]+'
      - 'v?[0-9]+.[0-9]+.[0-9]+-**'
  pull_request: {}

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-lint:
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    runs-on: ubuntu-latest
    steps:
      - uses: ioBroker/testing-action-check@v2
        with:
          node-version: '22.x'
          # No eslint/tsc yet — package checks only
          lint: false

  adapter-tests:
    needs: [check-and-lint]
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: ioBroker/testing-action-adapter@v1
        with:
          node-version: ${{ matrix.node-version }}
          os: ${{ matrix.os }}
          # Pure JS adapter — no build step
          build: false

  deploy:
    needs: [check-and-lint, adapter-tests]
    permissions:
      contents: write
      id-token: write
    if: |
      contains(github.event.head_commit.message, '[skip ci]') == false &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: ioBroker/testing-action-deploy@v1
        with:
          node-version: '22.x'
          build: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Trusted Publishing: no npm-token secret
